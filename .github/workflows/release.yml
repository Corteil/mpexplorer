name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Tag must match the package version
        run: |
          v=$(python -c "import re; print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          test "${GITHUB_REF_NAME}" = "v${v}" || { echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${v}"; exit 1; }
      - run: pip install -e '.[dev]' build twine
      - run: ruff check . && pytest -q
      - run: python -m build && twine check dist/*
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
