name: Windows build
# The portable Windows build (docs/WINDOWS_PLAN.md step 4): GTK 3 from MSYS2 UCRT64, frozen with PyInstaller,
# checked by running the built exe, uploaded as an artifact (a zip of the folder). Unsigned until the certificate arrives.
on:
  workflow_dispatch:
  workflow_call:          # the release workflow builds the zip it attaches with this same job
  push:                   # any branch where something that ends up in the exe changes, so main always has a current zip
    paths: ["mpexplorer/**", "packaging/windows/**", ".github/workflows/windows-build.yml", "pyproject.toml"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip git          # git: the spec records the commit being built (Help > About)
          pacboy: >-
            gtk3:p adwaita-icon-theme:p python:p python-gobject:p python-pip:p python-setuptools:p
            python-pyserial:p python-pillow:p python-cryptography:p python-yaml:p python-pytest:p
            pyinstaller:p pyinstaller-hooks-contrib:p
      - name: GTK from MSYS2's Python
        run: |
          python --version
          python -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version(), Gtk.get_micro_version())"
      - name: Install mpexplorer, esptool and the test tools
        run: python -m pip install --break-system-packages --no-build-isolation . "esptool>=5,<6" pytest-timeout
      - name: Tests in MSYS2's Python, GUI tests included
        run: python -m pytest -q -rs --timeout=60 -p no:cacheprovider
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/windows/mpexplorer.spec
      - name: Check the built program
        run: |
          cd dist/mpexplorer
          ls
          ./mpexplorer-console.exe --version
          ./mpexplorer-console.exe --self-test
          ./mpexplorer-console.exe --esptool version
          ./mpexplorer-console.exe --miniterm --help | head -3
      - name: Zip
        run: |
          cd dist
          touch mpexplorer/portable.txt.example
          zip -qr mpexplorer-windows.zip mpexplorer
          du -sh mpexplorer mpexplorer-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mpexplorer-windows
          path: dist/mpexplorer-windows.zip
          retention-days: 14
