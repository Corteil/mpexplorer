name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q

  # The same behaviours against real MicroPython (unix port) instead of the fake board.
  micropython:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mpy: ["v1.22.2", "v1.26.0"]
    env:
      MPY_REQUIRED: "1"       # a missing binary must fail here, not skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache MicroPython unix port
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/mpy-bin
          key: micropython-unix-${{ matrix.mpy }}-v1
      - name: Build MicroPython unix port
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config
          git clone --depth 1 --branch ${{ matrix.mpy }} https://github.com/micropython/micropython "$RUNNER_TEMP/mpy"
          make -C "$RUNNER_TEMP/mpy/mpy-cross" -j"$(nproc)"
          make -C "$RUNNER_TEMP/mpy/ports/unix" submodules
          make -C "$RUNNER_TEMP/mpy/ports/unix" -j"$(nproc)"
          mkdir -p ~/mpy-bin
          cp "$RUNNER_TEMP/mpy/ports/unix/build-standard/micropython" ~/mpy-bin/micropython
      - run: ~/mpy-bin/micropython -c "import sys; print(sys.version)"
      - run: pip install -e '.[dev]'
      - name: Tests against real MicroPython
        run: MICROPYTHON="$HOME/mpy-bin/micropython" pytest -v -rsP tests/test_real_micropython.py
