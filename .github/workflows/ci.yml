name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q

  # The same behaviours against real MicroPython (unix port) instead of the fake board.
  micropython:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Older releases (e.g. v1.22.2) abort on the first exception when built with the runner's GCC 15, so they would
        # need an older toolchain (a ubuntu:22.04 container). Add tags here once that is set up.
        mpy: ["v1.26.0", "v1.28.0"]      # v1.28.0 is what the 2024 badge firmware (badge-2024-software) is built on
    env:
      MPY_REQUIRED: "1"       # a missing binary must fail here, not skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore MicroPython build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/mpy-bin
          key: micropython-unix-${{ matrix.mpy }}-v2
      - name: Build MicroPython unix port
        id: build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config
          git clone --depth 1 --branch ${{ matrix.mpy }} https://github.com/micropython/micropython "$RUNNER_TEMP/mpy"
          # old releases do not compile warning-free with the runner's newer GCC, and v1.22 aborts with
          # "stack smashing detected" on the first exception when built with its default hardening
          make -C "$RUNNER_TEMP/mpy/mpy-cross" -j"$(nproc)" CFLAGS_EXTRA="-Wno-error -fno-stack-protector"
          make -C "$RUNNER_TEMP/mpy/ports/unix" submodules
          make -C "$RUNNER_TEMP/mpy/ports/unix" -j"$(nproc)" CFLAGS_EXTRA="-Wno-error -fno-stack-protector"
          mkdir -p ~/mpy-bin
          cp "$RUNNER_TEMP/mpy/ports/unix/build-standard/micropython" ~/mpy-bin/micropython
      - name: Save MicroPython build
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/mpy-bin
          key: micropython-unix-${{ matrix.mpy }}-v2
      - run: ~/mpy-bin/micropython -c "import sys; print(sys.version)"
      - run: pip install -e '.[dev]'
      - name: Tests against real MicroPython
        run: MICROPYTHON="$HOME/mpy-bin/micropython" pytest -v -rsPfE --timeout=60 tests/test_real_micropython.py
