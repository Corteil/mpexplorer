<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- mpexplorer's own Connect icon (original artwork, 2026-11-11): two arrows and an x, all at full strength,
       for a pane whose port is ready to connect (the owner wanted the not-connected look, but dark, with round
       ends). Each stroke is a filled bar with round ends, so GTK recolours it with the theme like other
       symbolic icons (it recolours fills, not strokes). Made by a script from the strokes' centre lines. -->
  <g fill="#2e3436">
    <!-- arrow to the right, along the top: shaft -->
    <path d="M4 6L14 6A1 1 0 0 0 14 4L4 4A1 1 0 0 0 4 6z"/>
    <!-- its head -->
    <path d="M10.793 3.207L13.293 5.707A1 1 0 0 0 14.707 4.293L12.207 1.793A1 1 0 0 0 10.793 3.207z"/>
    <path d="M12.207 8.207L14.707 5.707A1 1 0 0 0 13.293 4.293L10.793 6.793A1 1 0 0 0 12.207 8.207z"/>
    <!-- arrow to the left, lower down; shorter, to leave room for the x -->
    <path d="M8.5 10L2 10A1 1 0 0 0 2 12L8.5 12A1 1 0 0 0 8.5 10z"/>
    <!-- its head -->
    <path d="M3.793 7.793L1.293 10.293A1 1 0 0 0 2.707 11.707L5.207 9.207A1 1 0 0 0 3.793 7.793z"/>
    <path d="M5.207 12.793L2.707 10.293A1 1 0 0 0 1.293 11.707L3.793 14.207A1 1 0 0 0 5.207 12.793z"/>
    <!-- the x, bottom right -->
    <path d="M10.543 11.957L14.293 15.707A1 1 0 0 0 15.707 14.293L11.957 10.543A1 1 0 0 0 10.543 11.957z"/>
    <path d="M14.293 10.543L10.543 14.293A1 1 0 0 0 11.957 15.707L15.707 11.957A1 1 0 0 0 14.293 10.543z"/>
  </g>
</svg>
