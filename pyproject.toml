[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mpexplorer"
version = "0.3.0"
description = "Dual-pane file explorer for MicroPython boards (Pico, EMF badges). Nothing is installed on the target."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brian Corteil" }]
keywords = ["micropython", "circuitpython", "file-manager", "raspberry-pi", "pico", "esp32", "emf-camp", "tildagon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = ["pyserial>=3.5"]

[project.urls]
Homepage = "https://github.com/Corteil/mpexplorer"
Issues = "https://github.com/Corteil/mpexplorer/issues"
Changelog = "https://github.com/Corteil/mpexplorer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "ruff"]
firmware = ["esptool>=5,<6"]

[project.scripts]
mpexplorer = "mpexplorer.__main__:main"

[tool.setuptools.packages.find]
include = ["mpexplorer*"]

[tool.setuptools.package-data]
mpexplorer = ["icon.png", "mpexplorer.desktop"]

[tool.pytest.ini_options]
pythonpath = ["tests", "."]

[tool.ruff]
line-length = 120
extend-exclude = ["tools"]    # hand-run test rigs and probes (virtual mouse, GTK smoke), not shipped code

[tool.ruff.lint]
select = ["E", "F", "W"]
